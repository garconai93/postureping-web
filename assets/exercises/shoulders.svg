<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <radialGradient id="spot2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d4b8"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
    <linearGradient id="shirt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>

  <rect width="320" height="280" fill="url(#bg2)" rx="14"/>
  <ellipse cx="160" cy="180" rx="130" ry="60" fill="url(#spot2)"/>

  <!-- Head (static) -->
  <ellipse cx="160" cy="90" rx="30" ry="32" fill="url(#skin2)" stroke="#c99878" stroke-width="1.5"/>
  <path d="M132,82 Q140,60 160,58 Q180,60 188,82 L188,98 L132,98 Z" fill="#3a2818"/>
  <path d="M155,62 Q160,52 168,60 Q163,66 160,64 Z" fill="#2a1810"/>
  <ellipse cx="130" cy="92" rx="4" ry="7" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
  <ellipse cx="190" cy="92" rx="4" ry="7" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
  <path d="M143,82 Q150,79 157,82" stroke="#3a2818" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M163,82 Q170,79 177,82" stroke="#3a2818" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="88" r="2.5" fill="#2a1810"/>
  <circle cx="170" cy="88" r="2.5" fill="#2a1810"/>
  <circle cx="150.5" cy="87.5" r="0.8" fill="#fff"/>
  <circle cx="170.5" cy="87.5" r="0.8" fill="#fff"/>
  <path d="M153,107 Q160,111 167,107" stroke="#a0685a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="143" cy="98" r="3.5" fill="#ff9999" opacity="0.4"/>
  <circle cx="177" cy="98" r="3.5" fill="#ff9999" opacity="0.4"/>

  <!-- Neck -->
  <rect x="153" y="120" width="14" height="12" fill="url(#skin2)" stroke="#c99878" stroke-width="1"/>

  <!-- Animated shoulders rolling -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-15 160 175; 15 160 175; -15 160 175"
      dur="4s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- Torso (with arms attached, rotating as group) -->
    <path d="M115,200 L130,165 Q140,150 160,148 Q180,150 190,165 L205,200 L195,225 L125,225 Z"
          fill="url(#shirt2)" stroke="#22c1c3" stroke-width="1.5"/>

    <!-- Arms (left and right, rolled up showing shoulder motion) -->
    <ellipse cx="115" cy="170" rx="12" ry="10" fill="url(#skin2)" stroke="#c99878" stroke-width="1"/>
    <ellipse cx="205" cy="170" rx="12" ry="10" fill="url(#skin2)" stroke="#c99878" stroke-width="1"/>

    <!-- Hands near shoulders -->
    <circle cx="105" cy="155" r="8" fill="url(#skin2)" stroke="#c99878" stroke-width="1"/>
    <circle cx="215" cy="155" r="8" fill="url(#skin2)" stroke="#c99878" stroke-width="1"/>
  </g>

  <!-- Motion circle (background hint) -->
  <circle cx="160" cy="175" r="65" fill="none" stroke="#3ddc97" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate"
      values="0 160 175; 360 160 175" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Count badge -->
  <g transform="translate(160,255)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#3ddc97" opacity="0.15"/>
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="none" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#3ddc97" font-size="13" font-weight="700" font-family="-apple-system, sans-serif">5× înapoi</text>
  </g>
</svg>
