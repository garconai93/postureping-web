<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-label="Rotește umerii">
  <defs>
    <linearGradient id="sh-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>
  <g transform="translate(120,120)">
    <g stroke="url(#sh-g)" stroke-width="3" fill="none" stroke-linecap="round">
      <circle r="60" stroke-dasharray="3 6" opacity="0.4"/>
      <path d="M-80,-30 Q-90,0 -80,30">
        <animateTransform attributeName="transform" type="rotate"
          values="0;360" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M80,-30 Q90,0 80,30">
        <animateTransform attributeName="transform" type="rotate"
          values="0;360" dur="6s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="12" fill="rgba(61,220,151,0.2)" stroke="#3ddc97"/>
    </g>
    <text y="100" text-anchor="middle" fill="#8b94a8" font-size="14" font-family="sans-serif">cerc complet</text>
  </g>
