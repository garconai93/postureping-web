<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg" aria-label="Exercițiu: rotește umerii">
  <defs>
    <linearGradient id="shG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
    <radialGradient id="shZone" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Highlight zona umeri -->
  <ellipse cx="160" cy="170" rx="100" ry="35" fill="url(#shZone)"/>

  <!-- Cap (static) -->
  <circle cx="160" cy="85" r="28" fill="#1a2138" stroke="url(#shG)" stroke-width="2.5" filter="url(#glow2)"/>
  <circle cx="151" cy="82" r="2" fill="#8b94a8"/>
  <circle cx="169" cy="82" r="2" fill="#8b94a8"/>
  <path d="M155,98 Q160,102 165,98" stroke="#8b94a8" stroke-width="1.5" fill="none"/>

  <!-- Gât -->
  <rect x="150" y="113" width="20" height="15" rx="3" fill="#1a2138" stroke="url(#shG)" stroke-width="2"/>

  <!-- Umeri + brate (animat - cerc complet) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 160 170; 360 160 170" dur="6s" repeatCount="indefinite"/>

    <!-- Linie umeri -->
    <ellipse cx="160" cy="170" rx="80" ry="14" fill="#1a2138" stroke="url(#shG)" stroke-width="2"/>
    <!-- Braț stâng -->
    <ellipse cx="80" cy="170" rx="12" ry="8" fill="#1a2138" stroke="url(#shG)" stroke-width="2"/>
    <!-- Braț drept -->
    <ellipse cx="240" cy="170" rx="12" ry="8" fill="#1a2138" stroke="url(#shG)" stroke-width="2"/>
  </g>

  <!-- Săgeată cerc mare (background) -->
  <circle cx="160" cy="170" r="90" fill="none" stroke="#3ddc97" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Săgeată direcție (sus) -->
  <g transform="translate(160,60)">
    <path d="M0,0 L0,-15" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-15 L-5,-8 M0,-15 L5,-8" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Count -->
  <g transform="translate(160,225)">
    <rect x="-55" y="-14" width="110" height="28" rx="14" fill="rgba(61,220,151,0.15)" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#3ddc97" font-size="13" font-weight="600" font-family="sans-serif">
      5× înapoi
    </text>
  </g>

  <text x="160" y="265" text-anchor="middle" fill="#8b94a8" font-size="11" font-family="sans-serif">Eliberează tensiunea din trapez</text>
</svg>
