<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <radialGradient id="spot5" cx="50%" cy="65%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d4b8"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
    <linearGradient id="shirt5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>

  <rect width="320" height="280" fill="url(#bg5)" rx="14"/>
  <ellipse cx="160" cy="180" rx="140" ry="60" fill="url(#spot5)"/>

  <!-- Head -->
  <ellipse cx="160" cy="60" rx="26" ry="28" fill="url(#skin5)" stroke="#c99878" stroke-width="1.5"/>
  <path d="M135,55 Q143,38 160,36 Q177,38 185,55 L185,68 L135,68 Z" fill="#3a2818"/>
  <ellipse cx="134" cy="62" rx="4" ry="6" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
  <ellipse cx="186" cy="62" rx="4" ry="6" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
  <path d="M146,55 Q152,53 158,55" stroke="#3a2818" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M162,55 Q168,53 174,55" stroke="#3a2818" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="152" cy="60" r="2" fill="#2a1810"/>
  <circle cx="168" cy="60" r="2" fill="#2a1810"/>
  <path d="M155,75 Q160,78 165,75" stroke="#a0685a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="153" y="86" width="14" height="14" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
  <path d="M120,210 L135,110 Q145,100 160,98 Q175,100 185,110 L200,210 L190,225 L130,225 Z"
        fill="url(#shirt5)" stroke="#22c1c3" stroke-width="1.5"/>

  <!-- Left arm (extending down to wrist exercise) -->
  <ellipse cx="115" cy="140" rx="11" ry="35" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
  <ellipse cx="115" cy="180" rx="13" ry="8" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-30 115 195; 30 115 195; -30 115 195"
      dur="3s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Hand (left) - rotating -->
    <ellipse cx="115" cy="205" rx="14" ry="12" fill="url(#skin5)" stroke="#c99878" stroke-width="1.5"/>
    <!-- Fingers (4) -->
    <rect x="103" y="195" width="3" height="14" rx="1.5" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
    <rect x="108" y="193" width="3" height="15" rx="1.5" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
    <rect x="113" y="192" width="3" height="15" rx="1.5" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
    <rect x="118" y="193" width="3" height="15" rx="1.5" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
  </g>

  <!-- Right arm + hand (mirror) -->
  <ellipse cx="205" cy="140" rx="11" ry="35" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
  <ellipse cx="205" cy="180" rx="13" ry="8" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="30 205 195; -30 205 195; 30 205 195"
      dur="3s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <ellipse cx="205" cy="205" rx="14" ry="12" fill="url(#skin5)" stroke="#c99878" stroke-width="1.5"/>
    <rect x="217" y="195" width="3" height="14" rx="1.5" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
    <rect x="212" y="193" width="3" height="15" rx="1.5" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
    <rect x="207" y="192" width="3" height="15" rx="1.5" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
    <rect x="202" y="193" width="3" height="15" rx="1.5" fill="url(#skin5)" stroke="#c99878" stroke-width="1"/>
  </g>

  <!-- Motion circles around hands -->
  <circle cx="115" cy="200" r="25" fill="none" stroke="#3ddc97" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 115 200; 360 115 200" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="205" cy="200" r="25" fill="none" stroke="#3ddc97" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="360 205 200; 0 205 200" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Count badge -->
  <g transform="translate(160,250)">
    <rect x="-80" y="-13" width="160" height="26" rx="13" fill="#3ddc97" opacity="0.15"/>
    <rect x="-80" y="-13" width="160" height="26" rx="13" fill="none" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#3ddc97" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">10× sens orar · 10× invers</text>
  </g>
</svg>
