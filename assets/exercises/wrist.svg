<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-label="Roteste încheieturile">
  <defs>
    <linearGradient id="wr-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>
  <g transform="translate(120,120)">
    <g stroke="url(#wr-g)" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-40,-60 L-40,20 L-30,60 L40,60 L30,20 L30,-60 Z" fill="rgba(61,220,151,0.1)" stroke="#3ddc97" stroke-width="2"/>
      <g transform="translate(0,-30)">
        <ellipse rx="50" ry="20" fill="none" stroke-dasharray="3 4" opacity="0.4"/>
        <path d="M-50,0 A50,20 0 0,1 50,0" stroke="#3ddc97" stroke-width="3" fill="none">
          <animateTransform attributeName="transform" type="rotate"
            values="0;360" dur="4s" repeatCount="indefinite"/>
        </path>
        <path d="M-50,0 A50,20 0 0,1 50,0" stroke="#3ddc97" stroke-width="3" fill="none" opacity="0.5">
          <animateTransform attributeName="transform" type="rotate"
            values="180;540" dur="4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    <text y="100" text-anchor="middle" fill="#8b94a8" font-size="14" font-family="sans-serif">rotatie completă</text>
  </g>
</svg>
