<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg" aria-label="Exercițiu: rotește încheieturile">
  <defs>
    <linearGradient id="wrG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
    <radialGradient id="wrZone" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Highlight mâini -->
  <ellipse cx="105" cy="170" rx="50" ry="35" fill="url(#wrZone)"/>
  <ellipse cx="215" cy="170" rx="50" ry="35" fill="url(#wrZone)"/>

  <!-- Brațe (statice) -->
  <g stroke="url(#wrG)" stroke-width="2" fill="#1a2138">
    <!-- Braț stâng -->
    <path d="M70,90 L80,140 L105,165 L130,165 L135,140 L120,90 Z"/>
    <!-- Braț drept -->
    <path d="M250,90 L240,140 L215,165 L190,165 L185,140 L200,90 Z"/>
  </g>

  <!-- Încheieturi animate (rotație) -->
  <g transform="translate(105,165)">
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite" additive="sum"/>
    <ellipse rx="25" ry="8" fill="#3ddc97" opacity="0.3"/>
    <path d="M-22,0 L0,-8 L22,0 L0,8 Z" fill="#1a2138" stroke="#3ddc97" stroke-width="2.5"/>
    <!-- Degete -->
    <line x1="0" y1="-8" x2="0" y2="-16" stroke="#3ddc97" stroke-width="2"/>
    <line x1="6" y1="-7" x2="6" y2="-15" stroke="#3ddc97" stroke-width="2"/>
    <line x1="-6" y1="-7" x2="-6" y2="-15" stroke="#3ddc97" stroke-width="2"/>
  </g>

  <g transform="translate(215,165)">
    <animateTransform attributeName="transform" type="rotate" values="360;0" dur="4s" repeatCount="indefinite" additive="sum"/>
    <ellipse rx="25" ry="8" fill="#3ddc97" opacity="0.3"/>
    <path d="M-22,0 L0,-8 L22,0 L0,8 Z" fill="#1a2138" stroke="#3ddc97" stroke-width="2.5"/>
    <line x1="0" y1="-8" x2="0" y2="-16" stroke="#3ddc97" stroke-width="2"/>
    <line x1="6" y1="-7" x2="6" y2="-15" stroke="#3ddc97" stroke-width="2"/>
    <line x1="-6" y1="-7" x2="-6" y2="-15" stroke="#3ddc97" stroke-width="2"/>
  </g>

  <!-- Săgeți cerc (sus) -->
  <g transform="translate(105,130)" opacity="0.7">
    <path d="M-12,0 A12,8 0 1,1 12,0" stroke="#3ddc97" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M12,0 L8,-4 M12,0 L8,4" stroke="#3ddc97" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(215,130)" opacity="0.7">
    <path d="M-12,0 A12,8 0 1,1 12,0" stroke="#3ddc97" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M12,0 L8,-4 M12,0 L8,4" stroke="#3ddc97" stroke-width="2" fill="none"/>
  </g>

  <!-- Count -->
  <g transform="translate(160,235)">
    <rect x="-65" y="-13" width="130" height="26" rx="13" fill="rgba(61,220,151,0.15)" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#3ddc97" font-size="12" font-weight="600" font-family="sans-serif">
      10× sens orar · 10× invers
    </text>
  </g>
</svg>
