<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <radialGradient id="spot3" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d4b8"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
    <linearGradient id="shirt3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>

  <rect width="320" height="280" fill="url(#bg3)" rx="14"/>
  <ellipse cx="160" cy="140" rx="120" ry="80" fill="url(#spot3)"/>

  <!-- Chair back hint -->
  <rect x="100" y="60" width="120" height="14" fill="#1f2940" rx="3"/>
  <rect x="105" y="74" width="6" height="180" fill="#1f2940"/>
  <rect x="209" y="74" width="6" height="180" fill="#1f2940"/>

  <!-- Animated twisting torso -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-20 160 175; 20 160 175; -20 160 175"
      dur="5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- Head -->
    <ellipse cx="160" cy="90" rx="30" ry="32" fill="url(#skin3)" stroke="#c99878" stroke-width="1.5"/>
    <path d="M132,82 Q140,60 160,58 Q180,60 188,82 L188,98 L132,98 Z" fill="#3a2818"/>
    <path d="M155,62 Q160,52 168,60 Q163,66 160,64 Z" fill="#2a1810"/>
    <ellipse cx="130" cy="92" rx="4" ry="7" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
    <ellipse cx="190" cy="92" rx="4" ry="7" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
    <path d="M143,82 Q150,79 157,82" stroke="#3a2818" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M163,82 Q170,79 177,82" stroke="#3a2818" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="150" cy="88" r="2.5" fill="#2a1810"/>
    <circle cx="170" cy="88" r="2.5" fill="#2a1810"/>
    <circle cx="150.5" cy="87.5" r="0.8" fill="#fff"/>
    <circle cx="170.5" cy="87.5" r="0.8" fill="#fff"/>
    <path d="M153,107 Q160,111 167,107" stroke="#a0685a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="153" y="120" width="14" height="12" fill="url(#skin3)" stroke="#c99878" stroke-width="1"/>

    <!-- Torso -->
    <path d="M115,200 L130,150 Q140,135 160,133 Q180,135 190,150 L205,200 L195,235 L125,235 Z"
          fill="url(#shirt3)" stroke="#22c1c3" stroke-width="1.5"/>

    <!-- Arm crossed on chest (twist indication) -->
    <ellipse cx="155" cy="165" rx="22" ry="8" fill="url(#skin3)" stroke="#c99878" stroke-width="1.5" transform="rotate(-15 155 165)"/>
    <circle cx="178" cy="162" r="7" fill="url(#skin3)" stroke="#c99878" stroke-width="1"/>
  </g>

  <!-- Twist arrows -->
  <g transform="translate(45,150)" opacity="0.8">
    <path d="M0,0 Q-10,-10 -20,0" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M-20,0 L-16,-5 M-20,0 L-13,-5" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(275,150)" opacity="0.8">
    <path d="M0,0 Q10,10 20,0" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M20,0 L16,5 M20,0 L13,5" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Count badge -->
  <g transform="translate(160,260)">
    <rect x="-75" y="-13" width="150" height="26" rx="13" fill="#3ddc97" opacity="0.15"/>
    <rect x="-75" y="-13" width="150" height="26" rx="13" fill="none" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#3ddc97" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">3× stânga · 3× dreapta · 5s</text>
  </g>
</svg>
