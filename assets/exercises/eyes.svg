<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <radialGradient id="spot4" cx="50%" cy="35%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d4b8"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
  </defs>

  <rect width="320" height="280" fill="url(#bg4)" rx="14"/>
  <ellipse cx="160" cy="120" rx="130" ry="80" fill="url(#spot4)"/>

  <!-- Laptop screen (target to look at) -->
  <g transform="translate(160,230)">
    <rect x="-50" y="-25" width="100" height="50" rx="3" fill="#0a0e1a" stroke="#3ddc97" stroke-width="1.5"/>
    <rect x="-45" y="-20" width="90" height="40" fill="url(#spot4)" opacity="0.3"/>
    <rect x="-50" y="25" width="100" height="3" fill="#3ddc97"/>
    <text x="0" y="3" text-anchor="middle" fill="#3ddc97" font-size="9" font-family="-apple-system, sans-serif">📱 ecran</text>
  </g>

  <!-- Distance marker -->
  <g transform="translate(265,200)">
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#3ddc97" stroke-width="2"/>
    <path d="M-5,-25 L0,-32 M5,-25 L0,-32" stroke="#3ddc97" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-5,25 L0,32 M5,25 L0,32" stroke="#3ddc97" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="12" y="3" fill="#3ddc97" font-size="11" font-weight="700" font-family="-apple-system, sans-serif">6m+</text>
  </g>

  <!-- Person looking up slightly, with periodic blink -->
  <g>
    <!-- Head tilted slightly up -->
    <ellipse cx="160" cy="90" rx="32" ry="34" fill="url(#skin4)" stroke="#c99878" stroke-width="1.5"/>
    <path d="M125,80 Q135,55 160,52 Q185,55 195,80 Q200,95 195,100 L125,100 Q120,95 125,80 Z" fill="#3a2818"/>
    <ellipse cx="128" cy="92" rx="5" ry="8" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
    <ellipse cx="192" cy="92" rx="5" ry="8" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
    <path d="M143,80 Q150,77 157,80" stroke="#3a2818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M163,80 Q170,77 177,80" stroke="#3a2818" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Eyes (looking up + blink animation) -->
    <g>
      <circle cx="150" cy="86" r="3.5" fill="#fff"/>
      <circle cx="170" cy="86" r="3.5" fill="#fff"/>
      <circle cx="150" cy="84" r="2" fill="#4a6a5a"/>
      <circle cx="170" cy="84" r="2" fill="#4a6a5a"/>
      <circle cx="150" cy="83.5" r="0.8" fill="#fff"/>
      <circle cx="170" cy="83.5" r="0.8" fill="#fff"/>

      <!-- Blink overlay -->
      <rect x="142" y="86" width="16" height="6" fill="url(#skin4)">
        <animate attributeName="height" values="0;0;0;6;6;0;0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="162" y="86" width="16" height="6" fill="url(#skin4)">
        <animate attributeName="height" values="0;0;0;6;6;0;0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M160,93 Q158,98 160,100 Q162,98 160,93" fill="#d4a584"/>
    <path d="M153,107 Q160,112 167,107" stroke="#a0685a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="142" cy="98" r="4" fill="#ff9999" opacity="0.4"/>
    <circle cx="178" cy="98" r="4" fill="#ff9999" opacity="0.4"/>

    <!-- Neck -->
    <rect x="152" y="120" width="16" height="14" fill="url(#skin4)" stroke="#c99878" stroke-width="1"/>
  </g>

  <!-- Gaze line dotted -->
  <line x1="160" y1="100" x2="160" y2="200" stroke="#3ddc97" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Count badge -->
  <g transform="translate(160,265)">
    <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#3ddc97" opacity="0.15"/>
    <rect x="-85" y="-13" width="170" height="26" rx="13" fill="none" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#3ddc97" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">20-20-20 · 20s la 6m+</text>
  </g>
</svg>
