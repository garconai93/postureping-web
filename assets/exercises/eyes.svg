<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-label="Pauză de ochi">
  <defs>
    <linearGradient id="eye-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>
  <g transform="translate(120,120)">
    <g stroke="url(#eye-g)" stroke-width="3" fill="none" stroke-linecap="round">
      <ellipse cx="0" cy="0" rx="70" ry="40" opacity="0.3" stroke-dasharray="3 4"/>
      <path d="M-70,0 Q0,-40 70,0 Q0,40 -70,0">
        <animate attributeName="d" 
          values="M-70,0 Q0,-40 70,0 Q0,40 -70,0;
                  M-70,0 Q0,-25 70,0 Q0,25 -70,0;
                  M-70,0 Q0,-40 70,0 Q0,40 -70,0"
          dur="3s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="8" fill="#3ddc97">
        <animate attributeName="r" values="8;6;8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <line x1="-90" y1="0" x2="-75" y2="0" stroke-width="2"/>
      <line x1="75" y1="0" x2="90" y2="0" stroke-width="2"/>
    </g>
    <text y="100" text-anchor="middle" fill="#8b94a8" font-size="14" font-family="sans-serif">20-20-20 rule</text>
  </g>
</svg>
