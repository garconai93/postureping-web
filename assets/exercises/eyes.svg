<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg" aria-label="Exercițiu: pauză de ochi">
  <defs>
    <linearGradient id="eyeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
    <radialGradient id="eyeZone" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Highlight ochi -->
  <ellipse cx="160" cy="100" rx="90" ry="45" fill="url(#eyeZone)"/>

  <!-- Ecran (laptop) la distanță -->
  <g transform="translate(160,200)">
    <rect x="-30" y="-20" width="60" height="35" rx="3" fill="#1a2138" stroke="url(#eyeG)" stroke-width="1.5"/>
    <rect x="-25" y="-15" width="50" height="25" fill="#0a0e1a" opacity="0.8"/>
    <rect x="-30" y="15" width="60" height="3" fill="url(#eyeG)"/>
    <text x="0" y="-3" text-anchor="middle" fill="#3ddc97" font-size="9" font-family="sans-serif">📱 ecran</text>
  </g>

  <!-- Cap (față stilizată) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-8; 0,0" dur="3s" repeatCount="indefinite"/>

    <circle cx="160" cy="100" r="32" fill="#1a2138" stroke="url(#eyeG)" stroke-width="2.5"/>

    <!-- Ochi (clipesc) -->
    <ellipse cx="148" cy="98" rx="6" ry="4" fill="#fff">
      <animate attributeName="ry" values="4;0.5;4;4;4" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="172" cy="98" rx="6" ry="4" fill="#fff">
      <animate attributeName="ry" values="4;0.5;4;4;4" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="148" cy="98" r="2" fill="#3ddc97"/>
    <circle cx="172" cy="98" r="2" fill="#3ddc97"/>
  </g>

  <!-- Linie privire (de la ochi la distanță) -->
  <g opacity="0.5">
    <line x1="160" y1="105" x2="160" y2="180" stroke="#3ddc97" stroke-width="1.5" stroke-dasharray="3 4">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Distanță 6m -->
  <g transform="translate(260,150)">
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#3ddc97" stroke-width="2"/>
    <path d="M-6,-30 L0,-36 M6,-30 L0,-36" stroke="#3ddc97" stroke-width="2" fill="none"/>
    <path d="M-6,30 L0,36 M6,30 L0,36" stroke="#3ddc97" stroke-width="2" fill="none"/>
    <text x="14" y="3" fill="#3ddc97" font-size="11" font-family="sans-serif">6m+</text>
  </g>

  <!-- Count -->
  <g transform="translate(160,255)">
    <rect x="-75" y="-13" width="150" height="26" rx="13" fill="rgba(61,220,151,0.15)" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#3ddc97" font-size="12" font-weight="600" font-family="sans-serif">
      20-20-20: 20s la 6m+
    </text>
  </g>
</svg>
