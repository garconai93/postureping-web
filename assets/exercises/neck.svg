<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg" aria-label="Exercițiu: întinde gâtul">
  <defs>
    <linearGradient id="neckG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
    <radialGradient id="neckZone" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Highlight zona gât -->
  <ellipse cx="160" cy="85" rx="75" ry="45" fill="url(#neckZone)"/>

  <!-- Corp animat (cap + gât) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-8 160 125; 8 160 125; -8 160 125" dur="4s" repeatCount="indefinite"/>

    <!-- Cap -->
    <circle cx="160" cy="95" r="32"
            fill="#1a2138" stroke="url(#neckG)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Ochi -->
    <circle cx="150" cy="92" r="2" fill="#8b94a8"/>
    <circle cx="170" cy="92" r="2" fill="#8b94a8"/>
    <!-- Gura -->
    <path d="M155,108 Q160,112 165,108" stroke="#8b94a8" stroke-width="1.5" fill="none"/>
    <!-- Gât -->
    <rect x="148" y="125" width="24" height="20" rx="3"
          fill="#1a2138" stroke="url(#neckG)" stroke-width="2"/>
    <!-- Număr -->
    <text x="160" y="80" text-anchor="middle" fill="#3ddc97" font-size="13" font-weight="700" font-family="sans-serif">1</text>
  </g>

  <!-- Umeri (static) -->
  <path d="M70,170 Q90,155 110,160 L130,145 L145,140 L175,140 L190,145 L210,160 Q230,155 250,170 L245,180 L75,180 Z"
        fill="#1a2138" stroke="url(#neckG)" stroke-width="2"/>

  <!-- Săgeată stânga -->
  <g transform="translate(55,140)">
    <path d="M0,0 L-30,0" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M-30,0 L-22,-6 M-30,0 L-22,6" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Săgeată dreapta -->
  <g transform="translate(265,140)">
    <path d="M0,0 L30,0" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M30,0 L22,-6 M30,0 L22,6" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Count overlay -->
  <g transform="translate(160,220)">
    <rect x="-55" y="-14" width="110" height="28" rx="14" fill="rgba(61,220,151,0.15)" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#3ddc97" font-size="13" font-weight="600" font-family="sans-serif">
      3× stânga · 3× dreapta
    </text>
  </g>

  <text x="160" y="260" text-anchor="middle" fill="#8b94a8" font-size="11" font-family="sans-serif">Fără mișcări bruște · respiră adânc</text>
</svg>
