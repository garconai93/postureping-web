<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d4b8"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>

  <!-- Background subtle -->
  <rect width="320" height="280" fill="url(#bg)" rx="14"/>
  <ellipse cx="160" cy="100" rx="120" ry="80" fill="url(#spot)"/>

  <!-- Person character (friendly cartoon style) -->
  <g>
    <!-- Animated rotation of head/neck -->
    <animateTransform attributeName="transform" type="rotate"
      values="-12 160 150; 12 160 150; -12 160 150"
      dur="3s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- Hair top -->
    <path d="M125,80 Q135,55 160,52 Q185,55 195,80 Q200,95 195,100 L125,100 Q120,95 125,80 Z"
          fill="#3a2818"/>
    <!-- Hair tuft -->
    <path d="M155,55 Q160,45 170,52 Q165,58 160,56 Z" fill="#2a1810"/>

    <!-- Head -->
    <ellipse cx="160" cy="90" rx="32" ry="34" fill="url(#skin)" stroke="#c99878" stroke-width="1.5"/>

    <!-- Ears -->
    <ellipse cx="128" cy="92" rx="5" ry="8" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
    <ellipse cx="192" cy="92" rx="5" ry="8" fill="#e8b896" stroke="#c99878" stroke-width="1"/>

    <!-- Eyebrows (curved, friendly) -->
    <path d="M143,80 Q150,77 157,80" stroke="#3a2818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M163,80 Q170,77 177,80" stroke="#3a2818" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Eyes (closed/relaxed, dots) -->
    <circle cx="150" cy="88" r="2.5" fill="#2a1810"/>
    <circle cx="170" cy="88" r="2.5" fill="#2a1810"/>
    <circle cx="150.5" cy="87.5" r="0.8" fill="#fff"/>
    <circle cx="170.5" cy="87.5" r="0.8" fill="#fff"/>

    <!-- Nose -->
    <path d="M160,93 Q158,98 160,100 Q162,98 160,93" fill="#d4a584"/>

    <!-- Mouth (small smile) -->
    <path d="M153,107 Q160,112 167,107" stroke="#a0685a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Cheeks (rosy) -->
    <circle cx="142" cy="98" r="4" fill="#ff9999" opacity="0.4"/>
    <circle cx="178" cy="98" r="4" fill="#ff9999" opacity="0.4"/>

    <!-- Neck -->
    <rect x="152" y="120" width="16" height="14" fill="url(#skin)" stroke="#c99878" stroke-width="1"/>
  </g>

  <!-- Shoulders/upper body (static) -->
  <path d="M105,180 Q115,140 145,135 L175,135 Q205,140 215,180 L210,200 L110,200 Z"
        fill="url(#shirt)" stroke="#22c1c3" stroke-width="1.5"/>

  <!-- Shirt collar -->
  <path d="M145,135 L160,148 L175,135" fill="none" stroke="#1a8a5e" stroke-width="2" stroke-linejoin="round"/>

  <!-- Motion arrows left -->
  <g transform="translate(50,90)" opacity="0.85">
    <path d="M0,0 L-20,0" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M-20,0 L-15,-5 M-20,0 L-15,5" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Motion arrows right -->
  <g transform="translate(270,90)" opacity="0.85">
    <path d="M0,0 L20,0" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M20,0 L15,-5 M20,0 L15,5" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Count badge -->
  <g transform="translate(160,235)">
    <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#3ddc97" opacity="0.15"/>
    <rect x="-65" y="-16" width="130" height="32" rx="16" fill="none" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#3ddc97" font-size="13" font-weight="700" font-family="-apple-system, sans-serif">3× stânga · 3× dreapta</text>
  </g>

  <text x="160" y="265" text-anchor="middle" fill="#8b94a8" font-size="10" font-family="-apple-system, sans-serif">Fără mișcări bruște · respiră adânc</text>
</svg>
