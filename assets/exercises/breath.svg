<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg" aria-label="Exercițiu: respiră 4-7-8">
  <defs>
    <linearGradient id="brG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
    <radialGradient id="brZone" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Highlight piept -->
  <ellipse cx="160" cy="160" rx="75" ry="50" fill="url(#brZone)"/>

  <!-- Cap -->
  <circle cx="160" cy="80" r="26" fill="#1a2138" stroke="url(#brG)" stroke-width="2.5"/>
  <circle cx="152" cy="78" r="2" fill="#8b94a8"/>
  <circle cx="168" cy="78" r="2" fill="#8b94a8"/>
  <path d="M155,94 Q160,98 165,94" stroke="#8b94a8" stroke-width="1.5" fill="none"/>

  <!-- Gât -->
  <rect x="151" y="106" width="18" height="13" rx="3" fill="#1a2138" stroke="url(#brG)" stroke-width="2"/>

  <!-- Trunchi (piept animat - crește la inspirare) -->
  <g>
    <animateTransform attributeName="transform" type="scale"
      values="1,1; 1.15,1.1; 1,1; 0.95,0.95; 1,1" dur="19s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -24,-8; 0,0; 8,8; 0,0" dur="19s" repeatCount="indefinite" additive="sum"/>
    <path d="M125,120 L195,120 L200,200 L120,200 Z" fill="#1a2138" stroke="url(#brG)" stroke-width="2"/>
  </g>

  <!-- Cerc respirație (inspirare) -->
  <circle cx="160" cy="160" r="35" fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.5">
    <animate attributeName="r" values="30;55;30;25;30" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.5;0.3;0.3" dur="19s" repeatCount="indefinite"/>
  </circle>

  <!-- Faza curentă (text mare) -->
  <g transform="translate(160,160)">
    <text x="0" y="6" text-anchor="middle" fill="#3ddc97" font-size="22" font-weight="700" font-family="sans-serif">
      <animate attributeName="opacity"
        values="1;1;0;0;0;0;0;0;1"
        keyTimes="0;0.21;0.22;0.59;0.6;0.92;0.94;1;1"
        dur="19s" repeatCount="indefinite"/>
      Inspiră
    </text>
    <text x="0" y="6" text-anchor="middle" fill="#ffd166" font-size="22" font-weight="700" font-family="sans-serif">
      <animate attributeName="opacity"
        values="0;0;1;1;0;0;0;0"
        keyTimes="0;0.21;0.22;0.59;0.6;0.92;0.94;1"
        dur="19s" repeatCount="indefinite"/>
      Ține
    </text>
    <text x="0" y="6" text-anchor="middle" fill="#22c1c3" font-size="22" font-weight="700" font-family="sans-serif">
      <animate attributeName="opacity"
        values="0;0;0;0;1;1;0;0"
        keyTimes="0;0.21;0.22;0.59;0.6;0.92;0.94;1"
        dur="19s" repeatCount="indefinite"/>
      Expiră
    </text>
  </g>

  <!-- Countdown 4-7-8 -->
  <g transform="translate(160,40)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="rgba(61,220,151,0.15)" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="8" text-anchor="middle" fill="#3ddc97" font-size="16" font-weight="700" font-family="sans-serif">
      4 - 7 - 8
    </text>
  </g>

  <!-- Count -->
  <g transform="translate(160,245)">
    <rect x="-50" y="-13" width="100" height="26" rx="13" fill="rgba(61,220,151,0.15)" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#3ddc97" font-size="12" font-weight="600" font-family="sans-serif">
      Repetă de 3 ori
    </text>
  </g>
</svg>
