<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <radialGradient id="spot6" cx="50%" cy="55%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d4b8"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
    <linearGradient id="shirt6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>

  <rect width="320" height="280" fill="url(#bg6)" rx="14"/>
  <ellipse cx="160" cy="160" rx="120" ry="80" fill="url(#spot6)"/>

  <!-- 4-7-8 countdown badge -->
  <g transform="translate(160,40)">
    <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#3ddc97" opacity="0.15"/>
    <rect x="-50" y="-18" width="100" height="36" rx="18" fill="none" stroke="#3ddc97" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#3ddc97" font-size="18" font-weight="800" font-family="-apple-system, sans-serif">4 - 7 - 8</text>
  </g>

  <!-- Head (relaxed, eyes closed) -->
  <ellipse cx="160" cy="95" rx="30" ry="32" fill="url(#skin6)" stroke="#c99878" stroke-width="1.5"/>
  <path d="M132,87 Q140,65 160,63 Q180,65 188,87 L188,103 L132,103 Z" fill="#3a2818"/>
  <ellipse cx="130" cy="97" rx="4" ry="7" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
  <ellipse cx="190" cy="97" rx="4" ry="7" fill="#e8b896" stroke="#c99878" stroke-width="1"/>
  <path d="M143,85 Q150,82 157,85" stroke="#3a2818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M163,85 Q170,82 177,85" stroke="#3a2818" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes closed (calm lines) -->
  <path d="M144,92 Q150,95 156,92" stroke="#2a1810" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M164,92 Q170,95 176,92" stroke="#2a1810" stroke-width="2" fill="none" stroke-linecap="round"/>

  <path d="M160,98 Q158,103 160,105 Q162,103 160,98" fill="#d4a584"/>
  <path d="M153,113 Q160,116 167,113" stroke="#a0685a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="143" cy="105" r="3.5" fill="#ff9999" opacity="0.4"/>
  <circle cx="177" cy="105" r="3.5" fill="#ff9999" opacity="0.4"/>

  <!-- Neck -->
  <rect x="153" y="125" width="14" height="13" fill="url(#skin6)" stroke="#c99878" stroke-width="1"/>

  <!-- Animated chest (breathing) -->
  <g>
    <animateTransform attributeName="transform" type="scale"
      values="1,1; 1.18,1.18; 1.18,1.18; 1,1; 1,1"
      keyTimes="0; 0.21; 0.59; 0.95; 1"
      dur="19s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="translate"
      values="160,160; 137,138; 137,138; 160,160; 160,160"
      keyTimes="0; 0.21; 0.59; 0.95; 1"
      dur="19s" repeatCount="indefinite" additive="sum"/>

    <!-- Torso -->
    <path d="M115,200 L130,148 Q140,135 160,133 Q180,135 190,148 L205,200 L195,225 L125,225 Z"
          fill="url(#shirt6)" stroke="#22c1c3" stroke-width="1.5"/>
  </g>

  <!-- Breathing circle (pulses with breath) -->
  <circle cx="160" cy="180" r="40" fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-dasharray="4 4">
    <animate attributeName="r" values="30;55;55;30;30" keyTimes="0;0.21;0.59;0.95;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.21;0.59;0.95;1" dur="19s" repeatCount="indefinite"/>
  </circle>

  <!-- Phase text (big, centered) -->
  <g transform="translate(160,180)">
    <text x="0" y="6" text-anchor="middle" fill="#3ddc97" font-size="22" font-weight="800" font-family="-apple-system, sans-serif">
      <animate attributeName="opacity"
        values="1;1;0;0;0;1"
        keyTimes="0;0.21;0.22;0.59;0.95;1"
        dur="19s" repeatCount="indefinite"/>
      Inspiră
    </text>
    <text x="0" y="6" text-anchor="middle" fill="#ffd166" font-size="22" font-weight="800" font-family="-apple-system, sans-serif">
      <animate attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.21;0.22;0.59;0.95;1"
        dur="19s" repeatCount="indefinite"/>
      Ține
    </text>
    <text x="0" y="6" text-anchor="middle" fill="#22c1c3" font-size="22" font-weight="800" font-family="-apple-system, sans-serif">
      <animate attributeName="opacity"
        values="0;0;0;0;1;1"
        keyTimes="0;0.21;0.22;0.59;0.95;1"
        dur="19s" repeatCount="indefinite"/>
      Expiră
    </text>
  </g>

  <!-- Count badge -->
  <g transform="translate(160,255)">
    <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#3ddc97" opacity="0.15"/>
    <rect x="-65" y="-13" width="130" height="26" rx="13" fill="none" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#3ddc97" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">Repetă de 3 ori</text>
  </g>
</svg>
