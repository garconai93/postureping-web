<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-label="Respiră 4-7-8">
  <defs>
    <linearGradient id="br-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>
  <g transform="translate(120,120)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(61,220,151,0.2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="rgba(61,220,151,0.15)" stroke="#3ddc97" stroke-width="3">
      <animate attributeName="r" values="20;55;20" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="11s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" fill="#3ddc97" font-size="18" font-weight="700" font-family="sans-serif">
      <animate attributeName="opacity" values="1;1;0;0" dur="4s" repeatCount="indefinite"/>
      Inspiră
    </text>
    <text y="100" text-anchor="middle" fill="#8b94a8" font-size="13" font-family="sans-serif">4-7-8 technique</text>
  </g>
</svg>
